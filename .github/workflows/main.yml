name: Configs tests
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - master

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_all_profiles:
    runs-on: ubuntu-latest
    name: Check if all profiles are tested
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the profile registry is consistent
        run: python bin/cchecker.py
      - name: Test the test selection
        run: python -m unittest discover -s bin

  check_nextflow_config:
    name: Check if nextflow config runs in repository root
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - 26.04.0
          - latest-everything
    steps:
      - uses: actions/checkout@v4
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.NXF_VER }}
      - run: nextflow config -show-profiles ${GITHUB_WORKSPACE}

  lint_nextflow_config:
    name: Check if nextflow files are valid with nextflow lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - 26.04.0
          - latest-everything
    steps:
      - uses: actions/checkout@v4
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.NXF_VER }}
      - run: nextflow lint ${GITHUB_WORKSPACE}

  detect-changes:
    runs-on: ubuntu-latest
    name: Detect changed profiles
    outputs:
      tests: ${{ steps.detect.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python bin/detect_tests.py ${BASE:+"$BASE...$HEAD"} >> "$GITHUB_OUTPUT"

  profile_test:
    runs-on: ubuntu-latest
    name: Run ${{ matrix.test.profile }} profile ${{ matrix.test.pipeline }}
    needs: [test_all_profiles, detect-changes]
    if: needs.detect-changes.outputs.tests != '[]'
    env:
      SCRATCH: "~"
      NXF_GLOBAL_CONFIG: awsbatch.config
      PROFILE: ${{ matrix.test.profile }}
      PIPELINE: ${{ matrix.test.pipeline }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.detect-changes.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-everything"
      - name: Check ${{ matrix.test.profile }} profile
        if: matrix.test.pipeline == ''
        run: nextflow run configtest.nf -profile "$PROFILE"
      # --help parses the real config chain of the pipeline, then exits before any process starts
      - name: Check ${{ matrix.test.profile }} profile with nf-core/${{ matrix.test.pipeline }}
        if: matrix.test.pipeline != ''
        timeout-minutes: 10
        run: nextflow run "nf-core/$PIPELINE" -profile "test,$PROFILE" --help --custom_config_base "$GITHUB_WORKSPACE"
