name: Configs tests
on:
  pull_request:
    branches:
      - "*"

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_profiles:
    runs-on: ubuntu-latest
    name: configs registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: check_registry
        run: python ${GITHUB_WORKSPACE}/bin/check_registry.py
      - name: test_detect_changes
        run: python -m unittest discover -s ${GITHUB_WORKSPACE}/bin
      - name: Check for 'config_profile_contact' in config files
        run: |
          missing_files=$(grep -L 'config_profile_contact' conf/*.config)
          if [ -n "$missing_files" ]; then
            echo "The following config files are missing 'config_profile_contact':"
            echo "$missing_files"
            exit 1
          fi

  check_nextflow_config:
    name: nextflow config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - 26.04.0
          - latest-everything
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.NXF_VER }}
      - run: nextflow config -show-profiles ${GITHUB_WORKSPACE}

  detect_changes:
    runs-on: ubuntu-latest
    name: Detect changed profiles
    outputs:
      tests: ${{ steps.detect.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/detect-config-changes
        with:
          base: ${{ github.event.pull_request.base.sha }}

  profile_test:
    runs-on: ubuntu-latest
    name: profile ${{ matrix.test.profile }} (${{ matrix.NXF_VER }})
    needs: [check_profiles, detect_changes]
    if: needs.detect_changes.outputs.tests != '[]'
    env:
      SCRATCH: "~"
      NXF_GLOBAL_CONFIG: awsbatch.config
      PROFILE: ${{ matrix.test.profile }}
      PIPELINES: ${{ matrix.test.pipelines }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.detect_changes.outputs.tests) }}
        NXF_VER:
          - 26.04.0
          - latest-everything
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.NXF_VER }}
      - name: nextflow config
        run: nextflow config -profile "$PROFILE" ${GITHUB_WORKSPACE}
      # --help parses the real config chain of the pipeline, then exits before any process starts
      - name: nextflow run
        if: ${{ !cancelled() && matrix.test.pipelines != '' }}
        run: |
          status=0
          for pipeline in $PIPELINES; do
            for revision in "" dev; do
              nextflow run "nf-core/$pipeline" ${revision:+-r "$revision"} -profile "test,$PROFILE" --help --outdir results --custom_config_base "${GITHUB_WORKSPACE}" \
                || { echo "::error::nf-core/$pipeline ${revision:-default branch} failed with $PROFILE"; status=1; }
            done
          done
          exit $status

  confirm_pass:
    runs-on: ubuntu-latest
    name: Confirm CI pass
    needs: [check_profiles, check_nextflow_config, detect_changes, profile_test]
    if: always()
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
