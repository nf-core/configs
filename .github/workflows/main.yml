name: Configs tests
on:
  pull_request:
    branches:
      - "*"

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_profiles:
    runs-on: ubuntu-latest
    name: Check profile registry
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the profile registry is consistent
        run: python ${GITHUB_WORKSPACE}/bin/cchecker.py
      - name: Test the test selection
        run: python -m unittest discover -s ${GITHUB_WORKSPACE}/bin

  check_nextflow_config:
    name: Check if nextflow config runs in repository root
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - 26.04.0
          - latest-everything
    steps:
      - uses: actions/checkout@v4
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.NXF_VER }}
      - run: nextflow config -show-profiles ${GITHUB_WORKSPACE}

  detect-changes:
    runs-on: ubuntu-latest
    name: Detect changed profiles
    outputs:
      tests: ${{ steps.detect.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/detect-config-changes
        with:
          base: ${{ github.event.pull_request.base.sha }}

  profile_test:
    runs-on: ubuntu-latest
    name: Run ${{ matrix.test.profile }} profile (${{ matrix.NXF_VER }})
    needs: [check_profiles, detect-changes]
    if: needs.detect-changes.outputs.tests != '[]'
    env:
      SCRATCH: "~"
      NXF_GLOBAL_CONFIG: awsbatch.config
      PROFILE: ${{ matrix.test.profile }}
      PIPELINES: ${{ matrix.test.pipelines }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.detect-changes.outputs.tests) }}
        NXF_VER:
          - 26.04.0
          - latest-everything
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.NXF_VER }}
      - name: Check ${{ matrix.test.profile }} profile
        run: nextflow config -profile "$PROFILE" ${GITHUB_WORKSPACE}
      # --help parses the real config chain of the pipeline, then exits before any process starts
      - name: Check ${{ matrix.test.profile }} pipeline configs
        if: ${{ !cancelled() && matrix.test.pipelines != '' }}
        run: |
          status=0
          for pipeline in $PIPELINES; do
            for revision in "" dev; do
              nextflow run "nf-core/$pipeline" ${revision:+-r "$revision"} -profile "test,$PROFILE" --help --outdir results --custom_config_base "${GITHUB_WORKSPACE}" \
                || { echo "::error::nf-core/$pipeline ${revision:-default branch} failed with $PROFILE"; status=1; }
            done
          done
          exit $status

  confirm_pass:
    runs-on: ubuntu-latest
    name: Confirm CI pass
    needs: [check_profiles, check_nextflow_config, detect-changes, profile_test]
    if: always()
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
